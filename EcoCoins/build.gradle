plugins {
    id 'java'
}

group = "com.ecocoins"
version = "1.0.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly files("libs/HytaleServer.jar")
    compileOnly files("libs/EconomySystem-1.0.8.1-beta.jar")

    implementation "com.fasterxml.jackson.core:jackson-databind:2.17.2"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21)
}

jar {
    archiveBaseName.set("EcoCoins")

    // Empaquetar dependencias runtime (ej. jackson) dentro del jar del plugin
    // para evitar ClassNotFound en el loader del servidor.
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            "Implementation-Title": "EcoCoins",
            "Implementation-Version": version
        )
    }
}
